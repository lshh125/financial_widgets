<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Car Loan Tests</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; color: #1d2330; background: #fff; }
    .pass { color: #23711e; } .fail { color: #b2182b; font-weight: 700; }
    code { background: #f2f4f7; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Car loan payoff calculator: tests</h1>
  <p id="summary"></p>
  <ol id="out"></ol>
  <script src="calc.js"></script>
  <script>
  (function () {
    "use strict";
    const C = window.CarCalc;
    const results = [];
    const check = (name, got, want, tol = 0) =>
      results.push({ name, got, want, ok: typeof want === "number" ? got !== null && Math.abs(got - want) <= tol : got === want });
    const loan = { balance: 25000, apr: 0.06, months: 60, payment: 0 };

    // Amortization: $25,000 at 6% over 60 months -> $483.32/month, $3,999.20 total interest
    // (standard amortization tables).
    {
      const a = C.analyze(loan, "monthly", 0);
      check("Payment: $25k, 6%, 60 months", a.payment, 483.32, 0.005);
      check("Baseline: 60 payments", a.base.months, 60);
      check("Baseline total interest", a.base.totalInterest, 3999.20, 0.05);
      check("Balance never negative", a.base.rows.every((r) => r.end >= 0), true);
      check("Final payment does not exceed what is owed", Math.abs(a.base.finalPayment - (a.base.rows.at(-1).begin + a.base.rows.at(-1).interest)) < 1e-6, true);
      check("Rows: end = begin − scheduled − extra", a.base.rows.every((r) => Math.abs(r.begin - r.scheduled - r.extra - r.end) < 1e-6), true);
      // 6. Zero extra: nothing saved, no IRR.
      check("Zero extra: interest saved = 0", a.interestSaved, 0, 1e-9);
      check("Zero extra: months saved = 0", a.monthsSaved, 0);
      check("Zero extra: no IRR shown", a.irrAnnual, null);
    }

    // Small exact case: $1,200 at 0%, $100/month; $300 extra each month -> paid off in 3 months.
    {
      const a = C.analyze({ balance: 1200, apr: 0, months: 12, payment: 0 }, "monthly", 300);
      check("0% loan, $100 + $300/month: paid off in 3 months", a.scen.months, 3);
      check("0% loan: 9 months saved", a.monthsSaved, 9);
      check("0% loan: IRR of paying extra is 0%", a.irrAnnual, 0, 1e-9);
    }

    // The return on paying extra equals the loan rate for any amount (each prepaid dollar avoids
    // interest at APR/12 per month): independent check via NPV at the loan rate = 0.
    {
      for (const [mode, amt] of [["monthly", 50], ["monthly", 400], ["lump", 1000], ["lump", 15000]]) {
        const a = C.analyze(loan, mode, amt);
        check(`${mode} $${amt}: IRR = 6.00% APR`, a.irrAnnual, 0.06, 1e-9);
        check(`${mode} $${amt}: NPV of flows at APR/12 = 0`, C.npv(a.flows, 0.005), 0, 1e-6);
        check(`${mode} $${amt}: interest saved = baseline − scenario`, a.interestSaved, a.base.totalInterest - a.scen.totalInterest, 1e-9);
      }
    }

    // 7. Lump sum equal to the balance: no payments left, all interest saved.
    {
      const a = C.analyze(loan, "lump", 25000);
      check("Lump = balance: 0 months left", a.scen.months, 0);
      check("Lump = balance: all interest saved", a.interestSaved, a.base.totalInterest, 1e-6);
      check("Lump = balance: 60 months saved", a.monthsSaved, 60);
      check("Lump = balance: IRR = APR", a.irrAnnual, 0.06, 1e-9);
    }

    // 8. Extra that pays the loan off with the next payment.
    {
      const max = C.maxAmount(loan, "monthly");
      check("Max monthly extra = balance × (1 + r) − payment", max, 25000 * 1.005 - 483.3203, 0.01);
      const a = C.analyze(loan, "monthly", max);
      check("Max monthly extra: paid off in 1 month", a.scen.months, 1);
      check("Max monthly extra: final payment = balance + one month's interest", a.scen.finalPayment, 25125, 0.01);
      const over = C.analyze(loan, "monthly", max + 5000);
      check("Extra above the max is capped (no negative balance)", over.scen.rows[0].end, 0, 1e-9);
    }

    // IRR on a known cash flow: −100 now, +110 in 12 months -> (1.1)^(1/12) − 1 per month.
    {
      const c = [-100, ...new Array(11).fill(0), 110];
      check("IRR of −100 / +110 a year later", C.irr(c), Math.pow(1.1, 1 / 12) - 1, 1e-10);
      check("No IRR for flows with two sign changes", C.irr([-100, 230, -132]), null);
      check("No IRR for all-positive flows", C.irr([10, 10]), null);
    }

    // Rates: 6% APR, 24% tax, 5% money market -> 3.80% after tax; 7.89% needed before tax.
    check("After-tax yield: 5% at 24%", C.afterTaxYield(0.05, 0.24), 0.038, 1e-12);
    check("Required before-tax yield: 6% at 24%", C.requiredPreTax(0.06, 0.24), 0.078947, 1e-6);
    // 9. Tax rate zero.
    check("Tax 0%: after-tax = before-tax", C.afterTaxYield(0.05, 0), 0.05, 1e-12);
    check("Tax 0%: required = APR", C.requiredPreTax(0.06, 0), 0.06, 1e-12);
    // 10. Tax rate near and at 100%.
    check("Tax 99%: after-tax yield 0.05%", C.afterTaxYield(0.05, 0.99), 0.0005, 1e-12);
    check("Tax 99%: required before-tax yield 600%", C.requiredPreTax(0.06, 0.99), 6, 1e-9);
    check("Tax 100%: required yield undefined", C.requiredPreTax(0.06, 1), null);

    // Break-even: the return is the same for every amount, so no amount is reported.
    // 1. Loan rate above the after-tax yield (6% vs 3.8%).
    check("APR > after-tax yield: no break-even amount (flat)", C.breakEven(loan, "monthly", 0.038).status, "flat");
    // 2. Loan rate below (6% vs 7%).
    check("APR < after-tax yield: no break-even amount (flat)", C.breakEven(loan, "lump", 0.07).status, "flat");
    // 3. Equal rates: every amount is at break-even.
    check("APR = after-tax yield: every amount breaks even", C.breakEven(loan, "monthly", 0.06).status, "every");
    // 11. Short term: 1 month left.
    {
      const p = { balance: 1000, apr: 0.06, months: 1, payment: 0 };
      check("1 month left: payment clears the loan", C.analyze(p, "monthly", 0).base.months, 1);
      check("1 month left: no room for a monthly extra", C.breakEven(p, "monthly", 0.04).status, "none");
      check("1 month left: lump sum IRR = APR", C.analyze(p, "lump", 500).irrAnnual, 0.06, 1e-9);
    }
    // 12. The solver finds a crossing when the return does depend on the amount, and reports none
    //     when there is no crossing (synthetic return curves).
    {
      const f = C.solveBreakEven((x) => 0.02 + x / 10000, 0.05, 1000); // crosses at x = 300
      check("Solver: finds the crossing at 300", f.amount, 300, 0.01);
      check("Solver: no crossing -> status none", C.solveBreakEven((x) => 0.02 + x / 1e6, 0.05, 1000).status, "none");
      check("Solver: undefined returns -> status none", C.solveBreakEven(() => null, 0.05, 1000).status, "none");
    }
    // Payment too small to cover interest.
    check("Payment below the interest: error", typeof C.analyze({ ...loan, payment: 100 }, "monthly", 0).error, "string");

    // Advantage over the money market at the original end date: 0% money market -> equals interest saved.
    {
      const a = C.analyze(loan, "lump", 10000);
      check("0% money market: advantage = interest saved", C.advantageAtBaseEnd(a, 0), a.interestSaved, 1e-6);
      check("Money market at the loan rate: no advantage", C.advantageAtBaseEnd(a, 0.06), 0, 1e-6);
    }

    document.getElementById("out").innerHTML = results.map((r) =>
      `<li class="${r.ok ? "pass" : "fail"}">${r.ok ? "PASS" : "FAIL"}: ${r.name} <code>got ${typeof r.got === "number" ? r.got.toFixed(6) : r.got}</code>` +
      (typeof r.want === "number" ? ` <code>expected ${r.want.toFixed(6)}</code>` : ` <code>expected ${r.want}</code>`) + "</li>").join("");
    const passed = results.filter((r) => r.ok).length;
    document.getElementById("summary").textContent = `${passed} / ${results.length} passed`;
  })();
  </script>
</body>
</html>
